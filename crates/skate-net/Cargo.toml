[package]
name = "skate-net"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3 = "=1.8.7"
half = "=2.7.1"

# Browsers have no UDP sockets; web transports live in the game and server crates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = "0.6"

# `std::time::Instant::now` panics on wasm32-unknown-unknown; this reads `performance.now()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[dev-dependencies]
skate-core.workspace = true
