[package]
name = "skate-web-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
blake3 = "=1.8.7"
getrandom = "=0.4.3"
serde_json.workspace = true
tokio = { version = "=1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["fs", "set-header"] }
